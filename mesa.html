<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  #fundo { position:fixed; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,.62) 0%, rgba(0,0,0,.9) 100%);
           animation:escurece .9s ease both; }
  #cena { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:18px; pointer-events:none; }
  #moldura { position:relative; max-width:94vw; max-height:84vh; border-radius:14px; overflow:hidden; pointer-events:auto; cursor:zoom-in;
             box-shadow:0 18px 60px rgba(0,0,0,.8), 0 0 0 2px rgba(255,255,255,.18); }
  #moldura.zoom { cursor:zoom-out; }
  #img { display:block; max-width:94vw; max-height:84vh; transform-origin:50% 50%; }
  /* o olhar "focando" na mesa: começa desfocado e perto, depois ajusta o foco */
  #img.entrando { animation:foco 2.1s cubic-bezier(.22,.7,.2,1) both; }
  #img.pronto { transition:transform .4s ease; }
  #moldura.zoom #img { transform:scale(2.4); }
  #legenda { color:#fff; font-size:clamp(15px,1.8vw,22px); font-weight:700; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 2px 10px #000;
             opacity:0; animation:aparece .8s 1.7s ease both; }
  #x { position:fixed; top:16px; right:16px; z-index:10; width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
       background:rgba(14,12,18,.9); color:#fff; font-size:20px; line-height:1; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.6); }
  #x:hover { background:#7d2630; }
  #x:focus-visible { outline:2px solid #7a5cd6; outline-offset:2px; }

  @keyframes escurece { from { opacity:0; } }
  @keyframes aparece  { to { opacity:.95; } }
  @keyframes foco {
    0%   { opacity:0; filter:blur(28px) brightness(.55); transform:scale(1.28); }
    30%  { opacity:1; }
    58%  { filter:blur(8px) brightness(.9); }
    70%  { filter:blur(11px) brightness(.95); }   /* o foco "passa do ponto" e volta */
    100% { opacity:1; filter:blur(0) brightness(1); transform:scale(1); }
  }
  @media (prefers-reduced-motion:reduce) { #img.entrando, #fundo, #legenda { animation-duration:.01s; animation-delay:0s; } }
</style>
</head>
<body>
  <div id="fundo"></div>
  <div id="cena">
    <div id="moldura"><img id="img" alt="" draggable="false"></div>
    <div id="legenda"></div>
  </div>
  <button id="x" aria-label="Fechar" title="Fechar (Esc)">✕</button>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const MODAL_ID = "com.cris.mesas/janela";
const MESAS = {
  quirino:   "Mesa de Quirino",
  gideao:    "Mesa de Gideão",
  mercado:   "Mercado Paranormal",
  mercearia: "Mercearia"
};
const id = new URLSearchParams(location.search).get("m");
const img = document.getElementById("img");
const moldura = document.getElementById("moldura");

if (MESAS[id]) {
  document.getElementById("legenda").textContent = MESAS[id];
  img.addEventListener("load", () => {
    img.classList.add("entrando");
    img.addEventListener("animationend", () => { img.classList.remove("entrando"); img.classList.add("pronto"); }, { once: true });
  }, { once: true });
  img.src = `mesa-${id}.webp`;
}

// clicar na mesa dá zoom para ler as etiquetas; mover o mouse leva a visão
moldura.addEventListener("click", e => {
  if (!img.classList.contains("pronto")) return;
  moldura.classList.toggle("zoom");
  const r = moldura.getBoundingClientRect();
  img.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
});
moldura.addEventListener("pointermove", e => {
  if (!moldura.classList.contains("zoom")) return;
  const r = moldura.getBoundingClientRect();
  img.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
});

const fechar = () => OBR.modal.close(MODAL_ID);
document.getElementById("x").addEventListener("click", fechar);
document.getElementById("fundo").addEventListener("click", fechar);
document.getElementById("cena").addEventListener("click", e => { if (e.target.id === "cena") fechar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
</script>
</body>
</html>
